# Central configuration. Paths point OUTSIDE the repo for private data.
sample_id: "TUMOR01"            # public alias used in every output; the lab sample ID never appears in outputs
data:
  dna_r1: "../TUMOR01/DNA/TUMOR01_DNA_R1_001.fastq.gz"
  dna_r2: "../TUMOR01/DNA/TUMOR01_DNA_R2_001.fastq.gz"
  rna_r1: "../TUMOR01/RNA/TUMOR01_RNA_R1_001.fastq.gz"
  rna_r2: "../TUMOR01/RNA/TUMOR01_RNA_R2_001.fastq.gz"
library:
  chemistry: "IDT/Archer Anchored Multiplex PCR (AMP), Liquid P5 MBC + P7 adapters"
  umi_len: 12
  dna_common_region: "AGTCGTCTCGAAG"   # + T (ligation overhang) => skip 14 bases after the UMI
  rna_common_region: "CTGGATAGTACGCT"
  umi_skip: 14
  read2_starts_with_primer: true
cancer_type: "Cholangiocarcinoma"      # from the laboratory report; drives the evidence/trial queries
# The synthetic example carries lung-flavoured drivers (KRAS G12C, EGFR L858R, BRAF V600E), so it is tiered
# against that diagnosis - otherwise every variant would be capped at Tier II for the wrong reason.
example_cancer_type: "Lung Non-small Cell Carcinoma"
tumour_content: 0.70                    # pathology estimate - a somatic clonal variant caps out near 0.35 VAF
panel:
  dna_name: "Archer VariantPlex Expanded Solid Tumor (76 genes; SNV/indel, CNV, MSI)"
  rna_name: "Archer FusionPlex Lung v2 (17 genes; fusions + SNV/indel, incl. MET exon 14 skipping)"
  dna_bed: "resources/panel_dna.bed"
  rna_bed: "resources/panel_rna.bed"
  dna_genes: "resources/panel_variantplex_expanded_solid_tumor.txt"
  rna_genes: "resources/panel_fusionplex_lung_v2.txt"
  lab_reference_build: "GRCh37/hg19 (the laboratory's pipeline; ours uses GRCh38)"
  min_depth_assessable: 100
reference:
  build: "GRCh38 (hg38, Galaxy built-in indexes)"
  gnomad_af_only: "https://storage.googleapis.com/gatk-best-practices/somatic-hg38/af-only-gnomad.hg38.vcf.gz"
thresholds:
  min_vaf: 0.02
  min_alt_reads: 8
  germline_popmax_af: 0.001
  het_germline_vaf_window: [0.40, 0.60]
  min_callers_agree: 2
apis:
  vep_rest: "https://rest.ensembl.org"
  civic_graphql: "https://civicdb.org/api/graphql"
  oncokb: "https://www.oncokb.org/api/v1"       # token from env ONCOKB_TOKEN (academic)
  clinicaltrials: "https://clinicaltrials.gov/api/v2"
  dgidb: "https://dgidb.org/api/graphql"
